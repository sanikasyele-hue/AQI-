{% extends 'base.html' %}
{% block title %}Admin Login{% endblock %}
{% block extra_css %}
<style>
.login-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2.5rem;width:100%;max-width:400px;}
.login-title{font-family:'Rajdhani',sans-serif;font-size:1.75rem;font-weight:700;text-align:center;margin-bottom:.5rem;}
</style>
{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-title">🔐 Admin <span class="accent">Login</span></div>
    <p style="text-align:center;color:var(--muted2);font-size:.875rem;margin-bottom:2rem;">Enter credentials to access dashboard, history &amp; charts</p>
    <form method="POST">{% csrf_token %}
      <div class="form-group"><label>Username</label><input type="text" name="username" placeholder="admin" required autofocus></div>
      <div class="form-group"><label>Password</label><input type="password" name="password" placeholder="••••••••" required></div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:.875rem;margin-top:.5rem;">Login to Dashboard</button>
    </form>
    <div style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border);text-align:center;font-size:.8rem;color:var(--muted);">Default: <code style="background:var(--bg);padding:2px 6px;border-radius:4px;">admin / Test@123</code></div>
  </div>
</div>
{% endblock %}
